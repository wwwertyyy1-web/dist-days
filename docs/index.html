<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出貨日・停滯日</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b2430;--mute:#6b7685;--line:#dde1e7;--up:#d6322e;--down:#1f9d62;--dist:#5b3fd1;--stall:#e08a00;--gone:#a7aeb9}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--panel:#1a2029;--ink:#e6e9ee;--mute:#8b95a3;--line:#2b3340;--up:#ef5350;--down:#34b57a;--dist:#9a85ff;--stall:#f0a030;--gone:#5b6573}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 16px;border-radius:6px;font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat{display:flex;gap:28px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.big{font-size:44px;font-weight:700;line-height:1;color:var(--dist)}
.stat span{color:var(--mute);font-size:13px}
.warn{color:var(--up);font-weight:600}
#chart{height:480px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:10px 0 18px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:18px}
.params label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mute);gap:3px}
.params input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:14px}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;font-size:12.5px}
.scroll{overflow-x:auto}
#note{color:var(--up);font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<main>
  <h1>歐尼爾出貨日與停滯日</h1>
  <div class="sub" id="updated">載入中…</div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="stat">
    <div class="big" id="count">–</div>
    <span>目前有效出貨日<br><b id="stallCount">–</b> 個近 25 日內的停滯日</span>
    <span id="verdict"></span>
  </div>
  <div id="note"></div>
  <div id="chart"></div>
  <div class="legend">
    <span><i style="background:var(--dist)"></i>有效出貨日 D</span>
    <span><i style="background:var(--gone)"></i>已失效出貨日</span>
    <span><i style="background:var(--stall)"></i>停滯日 S</span>
  </div>
  <div class="params" id="params"></div>
  <div class="scroll"><table>
    <thead><tr><th>有效出貨日</th><th>單日跌幅</th><th>收盤</th><th>距今交易日</th><th>此後最大漲幅</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const P = {drop:0.2, stallMax:0.4, stallPos:50, expire:25, rally:5};
const FIELDS = [
  ["drop","出貨日跌幅 ≥（%）",0.05],["stallMax","停滯日漲幅 ≤（%）",0.05],
  ["stallPos","停滯日收盤位置 ＜ 區間（%）",5],["expire","失效天數（交易日）",1],["rally","失效漲幅（%）",0.5]
];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let ALL, current, chart, candle, vol;

function analyze(rows){
  const n = rows.length, last = n-1, res = {dist:[], stall:[]};
  for(let i=1;i<n;i++){
    const r=rows[i], p=rows[i-1];
    if(!r.v||!p.v) continue;
    const pct=(r.c/p.c-1)*100, volUp=r.v>p.v;
    const pos=r.h>r.l ? (r.c-r.l)/(r.h-r.l)*100 : 50;
    if(volUp && pct<=-P.drop){
      const age=last-i;
      const maxC=Math.max(...rows.slice(i).map(x=>x.c));
      const rallyPct=(maxC/r.c-1)*100;
      res.dist.push({i,pct,age,rallyPct,active:age<P.expire && rallyPct<P.rally});
    } else if(volUp && pct>=0 && pct<=P.stallMax && pos<P.stallPos){
      res.stall.push({i,age:last-i});
    }
  }
  return res;
}

function render(){
  const rows = ALL.data[current].slice(-260);
  const a = analyze(rows);
  const zero = rows.filter(r=>!r.v).length > rows.length/2;
  document.getElementById("note").textContent = zero ? "這個指數沒有成交量資料，無法判斷出貨日。可改用 DIA 的資料。" : "";
  candle.setData(rows.map(r=>({time:r.t,open:r.o,high:r.h,low:r.l,close:r.c})));
  vol.setData(rows.map(r=>({time:r.t,value:r.v,color:(r.c>=r.o?css("--up"):css("--down"))+"66"})));
  const m = [];
  a.dist.forEach(d=>m.push({time:rows[d.i].t,position:"aboveBar",shape:"arrowDown",
    color:d.active?css("--dist"):css("--gone"),text:d.active?"D":""}));
  a.stall.forEach(s=>m.push({time:rows[s.i].t,position:"aboveBar",shape:"circle",
    color:css("--stall"),text:s.age<P.expire?"S":""}));
  m.sort((x,y)=>x.time<y.time?-1:1);
  candle.setMarkers(m);

  const act = a.dist.filter(d=>d.active);
  const el = document.getElementById("count");
  el.textContent = act.length;
  document.getElementById("stallCount").textContent = a.stall.filter(s=>s.age<P.expire).length;
  const v = document.getElementById("verdict");
  v.innerHTML = act.length>=5 ? '<span class="warn">五個以上，市場承壓</span>' : act.length>=3 ? "三到四個，需留意" : "";
  document.getElementById("rows").innerHTML = act.slice().reverse().map(d=>{
    const r=rows[d.i];
    return `<tr><td>${r.t}</td><td>${d.pct.toFixed(2)}%</td><td>${r.c.toLocaleString()}</td><td>${d.age}</td><td>${d.rallyPct.toFixed(2)}%</td></tr>`;
  }).join("") || '<tr><td colspan="5" style="text-align:center;color:var(--mute)">目前沒有有效出貨日</td></tr>';
}

function build(){
  chart = LightweightCharts.createChart(document.getElementById("chart"),{
    layout:{background:{color:css("--panel")},textColor:css("--mute")},
    grid:{vertLines:{color:css("--line")},horzLines:{color:css("--line")}},
    rightPriceScale:{borderColor:css("--line")},timeScale:{borderColor:css("--line")},autoSize:true});
  candle = chart.addCandlestickSeries({upColor:css("--up"),downColor:css("--down"),
    borderUpColor:css("--up"),borderDownColor:css("--down"),wickUpColor:css("--up"),wickDownColor:css("--down")});
  candle.priceScale().applyOptions({scaleMargins:{top:0.08,bottom:0.25}});
  vol = chart.addHistogramSeries({priceFormat:{type:"volume"},priceScaleId:"vol"});
  vol.priceScale().applyOptions({scaleMargins:{top:0.8,bottom:0}});
}

fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
  ALL=d; const names=Object.keys(d.data); current=names[0];
  document.getElementById("updated").textContent="資料更新：" + new Date(d.updated).toLocaleString("zh-TW") + "　最新交易日：" + d.data[current].at(-1).t;
  const tabs=document.getElementById("tabs");
  names.forEach(n=>{const b=document.createElement("button");b.textContent=n;b.setAttribute("role","tab");
    b.setAttribute("aria-selected",n===current);
    b.onclick=()=>{current=n;[...tabs.children].forEach(x=>x.setAttribute("aria-selected",x===b));render();chart.timeScale().fitContent();};
    tabs.appendChild(b);});
  const pr=document.getElementById("params");
  FIELDS.forEach(([k,label,step])=>{
    const l=document.createElement("label");l.textContent=label;
    const i=document.createElement("input");i.type="number";i.step=step;i.value=P[k];
    i.oninput=()=>{const x=parseFloat(i.value);if(!isNaN(x)){P[k]=x;render();}};
    l.appendChild(i);pr.appendChild(l);});
  build();render();chart.timeScale().fitContent();
}).catch(()=>{document.getElementById("updated").textContent="讀不到 data.json，請先執行 fetch.py 或等待 GitHub Actions 跑完。";});
</script>
</body>
</html>
